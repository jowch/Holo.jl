name: CI

on:
  push:
    branches: [main]
  pull_request:

# needed for the bundle commit-back on main (CI is the sole author of
# assets/overlay.js and assets/holo-webgl.js)
permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  julia:
    name: Julia ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ['1.10', '1']
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        env:
          GROUP: Core
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          flags: julia-${{ matrix.version }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  no-backend:
    # Holo core with NEITHER backend extension loaded — the "load a renderer" error path.
    # Own job: it must run in a process that never `using`s CairoMakie/WGLMakie, so it can't
    # share a job with `julia` (Core) or `webgl` without risking load order flakiness.
    name: No-backend error path
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        env:
          GROUP: NoBackend
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          flags: no-backend
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  webgl:
    # The :webgl extension isn't covered by the `julia` job (GROUP=Core loads CairoMakie
    # only). Run its suite — incl. the WGLMakie/Bonito version-coupling guard and the
    # both-loaded Cairo default — so a dependency bump that moves the wire format fails the
    # gate here instead of only on a manual local run. Pinned to 1.10, the compat floor
    # Task 4 verified.
    name: WGLMakie extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - uses: julia-actions/cache@v2
      - name: Instantiate + test WGLMakie extension
        run: |
          julia --project=. -e 'using Pkg; Pkg.instantiate()'
          GROUP=WebGL julia --project=. -e 'using Pkg; Pkg.test(; coverage=true)'
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          flags: webgl
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      # Real-browser `@bind` round-trip: generate the self-contained widget page, then click
      # scatter marker 0 in headless Chromium and assert the overlay emits the right bond
      # value. Covers the browser half the Julia unit tests can't reach.
      - name: Generate :webgl E2E page
        run: julia --project=. test/e2e/make_page.jl "$RUNNER_TEMP/e2e"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright + Chromium
        working-directory: test/e2e
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Run real-browser bind E2E
        working-directory: test/e2e
        run: node click.mjs "$RUNNER_TEMP/e2e"
      - name: Verify browser-emitted value through transform_value
        run: julia --project=. test/e2e/verify_capture.jl "$RUNNER_TEMP/e2e"

  webgl-bind-e2e:
    # THROUGH-Pluto `@bind` E2E: a live headless Pluto kernel + real Chromium. Isolated as its
    # own job (heaviest, and the one most exposed to Pluto-version churn) so it reads cleanly
    # and is trivial to drop if it ever proves flaky.
    name: WGLMakie bind E2E (Pluto)
    runs-on: ubuntu-latest
    # Worst case inside "Through-Pluto bind round-trip": 25min mount + 2×5min PLUTO_MS attempts
    # ≈ 35min, plus the port-readiness loop (≤4min) and setup steps before it — 45min leaves
    # headroom so a legitimate cold-cache run doesn't race the job-level timeout (which would
    # cancel, not fail, the step and skip the artifact upload below).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - uses: julia-actions/cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright + Chromium
        working-directory: test/e2e
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Pre-warm env (precompile into the cached depot)
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Through-Pluto bind round-trip
        working-directory: test/e2e
        run: |
          julia serve.jl 1234 > pluto.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER 2>/dev/null || true' EXIT
          up=
          for i in $(seq 1 120); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:1234 || echo 000)
            [ "$code" = "200" ] && { up=1; break; }
            sleep 2
          done
          [ -n "$up" ] || { echo "::error::Pluto never came up on :1234"; cat pluto.log; exit 1; }
          node bind_click.mjs http://127.0.0.1:1234 "$GITHUB_WORKSPACE/test/e2e/bind_notebook.jl" "$RUNNER_TEMP/bind-e2e-artifacts"
      - name: Pluto server log (precompile + render timing)
        if: always()
        working-directory: test/e2e
        run: tail -n 200 pluto.log || true
      - name: Upload failure artifacts (screenshot, DOM dump, Pluto log)
        # cancelled(), not just failure(): a job-level timeout-minutes kill marks the running
        # step "cancelled", not "failed" — failure() alone would silently skip this exact upload
        # on the one occasion (a genuine timeout) it matters most.
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: bind-e2e-failure
          path: |
            ${{ runner.temp }}/bind-e2e-artifacts/
            test/e2e/pluto.log
          if-no-files-found: ignore
          retention-days: 14

  kind-sweep:
    # Advisory (continue-on-error): CLAUDE.md's live-verification playbook
    # (docs/dev/live-interaction-checklist.md) mandates kind_sweep.mjs + polish_verify.mjs on
    # every backend before a user-facing change is "done", but until now only click.mjs/
    # bind_click.mjs ran in CI. This job runs the full sweep so a regression shows up on the
    # PR without gating merges yet — promote to required once it's proven stable.
    name: Kind sweep (${{ matrix.backend }})
    runs-on: ubuntu-latest
    continue-on-error: true
    # kind_sweep.mjs's own mount deadline is 25min, polish_verify.mjs's is 15min — 40min of
    # driver budget alone, before checkout/playwright-install/cold-instantiate, and the run
    # deliberately runs polish_verify even after kind_sweep fails (both deadlines can burn).
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        backend: [cairo, webgl]
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('test/e2e/package.json') }}
      - name: Install Playwright + Chromium
        working-directory: test/e2e
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Instantiate shared dev env (Holo + both Makies)
        run: |
          mkdir -p "$RUNNER_TEMP/holo-dev"
          julia --project="$RUNNER_TEMP/holo-dev" -e '
            using Pkg
            Pkg.develop(path=pwd())
            Pkg.add(["CairoMakie", "WGLMakie", "JSON3"])
            Pkg.instantiate()
          '
          echo "HOLO_DEV_ENV=$RUNNER_TEMP/holo-dev" >> "$GITHUB_ENV"
      - name: Kind sweep + polish verify
        working-directory: test/e2e
        env:
          JULIA_NOSYSIMAGE: ${{ matrix.backend == 'webgl' && '1' || '' }}
        run: |
          NOTEBOOK="$GITHUB_WORKSPACE/test/e2e/kind_sweep_${{ matrix.backend }}.jl"
          ARTIFACTS="$RUNNER_TEMP/kind-sweep-artifacts"
          mkdir -p "$ARTIFACTS"
          julia serve.jl 1240 > pluto.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER 2>/dev/null || true' EXIT
          up=
          for i in $(seq 1 120); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:1240 || echo 000)
            [ "$code" = "200" ] && { up=1; break; }
            sleep 2
          done
          [ -n "$up" ] || { echo "::error::Pluto never came up on :1240 (${{ matrix.backend }})"; cat pluto.log; exit 1; }

          status=0
          node kind_sweep.mjs http://127.0.0.1:1240 "$NOTEBOOK" ${{ matrix.backend }} "$ARTIFACTS" || status=1
          node polish_verify.mjs http://127.0.0.1:1240 "$NOTEBOOK" ${{ matrix.backend }} "$ARTIFACTS" || status=1
          exit $status
      - name: Pluto server log (${{ matrix.backend }})
        if: always()
        working-directory: test/e2e
        run: tail -n 200 pluto.log || true
      - name: Upload artifacts (${{ matrix.backend }})
        # always(), not failure(): a job-level timeout-minutes kill marks the running step
        # cancelled, not failed, so failure() alone would silently skip the upload on the one
        # occasion (a genuine timeout) it matters most (see PR #67's bind-e2e-failure upload for
        # the same reasoning). if-no-files-found: ignore keeps a passing run's upload a no-op
        # beyond pluto.log, which is itself useful wall-time evidence.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kind-sweep-${{ matrix.backend }}
          path: |
            ${{ runner.temp }}/kind-sweep-artifacts/
            test/e2e/pluto.log
          if-no-files-found: ignore
          retention-days: 14

  examples:
    name: Example notebooks
    runs-on: ubuntu-latest
    # Each notebook devs the package + adds CairoMakie into a temp env (full Makie
    # precompile on a cold cache); generous ceiling so a slow run fails loud, not hangs.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      # Runs every Pluto notebook in examples/ headlessly; fails if any cell errors,
      # so an example can never silently drift out of sync with the package API.
      - name: Run example notebooks headlessly
        run: julia --color=yes examples/ci_run.jl

  frontend:
    name: Frontend (TS) + bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - uses: codecov/codecov-action@v5
        with:
          files: frontend/coverage/lcov.info
          flags: frontend
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - run: npm run build

      # PRs (incl. forks, which can't push): fail if either committed bundle is stale.
      - name: Verify committed bundles are up to date
        if: github.event_name == 'pull_request'
        working-directory: .
        run: |
          if ! git diff --quiet -- assets/overlay.js assets/holo-webgl.js; then
            echo "::error::frontend assets are out of date — run 'cd frontend && npm run build' and commit."
            git --no-pager diff --stat -- assets/overlay.js assets/holo-webgl.js
            exit 1
          fi

      # Push to main: CI owns both bundles — commit whichever rebuilt so main is never stale.
      - name: Commit rebuilt bundles
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: .
        run: |
          if ! git diff --quiet -- assets/overlay.js assets/holo-webgl.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/overlay.js assets/holo-webgl.js
            git commit -m "ci: rebuild frontend assets [skip ci]"
            git pull --rebase origin main   # serialize with a second push landing on main mid-run
            git push
          fi

  format:
    name: Runic formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: fredrikekre/runic-action@v1
        with:
          version: '1'
